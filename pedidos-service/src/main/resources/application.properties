spring.application.name=pedidos-service
eureka.client.enabled=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
server.address=127.0.0.1
server.port=${PORT:8087}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/pedidos}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

productos.url=${PRODUCTOS_URL:http://127.0.0.1:8086}
spring.flyway.locations=classpath:db/migracion
