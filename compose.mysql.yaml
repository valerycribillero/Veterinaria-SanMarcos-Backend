name: veterinaria-sanmarcos-docker

x-mysql-client: &mysql-client
  SPRING_DATASOURCE_USERNAME: "sanmarcos"
  SPRING_DATASOURCE_PASSWORD: "${DOCKER_MYSQL_PASSWORD:-sanmarcos-local}"

x-mysql-ready: &mysql-ready
  mysql:
    condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_HOST: "localhost"
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_USER: "sanmarcos"
      MYSQL_PASSWORD: "${DOCKER_MYSQL_PASSWORD:-sanmarcos-local}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init/01-bases.sql:/docker-entrypoint-initdb.d/01-bases.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" agenda --execute="SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

  usuarios:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  mensajeria-service:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mensajeria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  mascota:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mascota?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  catalogo:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/producto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  ficha:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sanmarcos_ficha_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  productos-service:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/productos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  pedidos-service:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  agenda-service:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  compras:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sanmarcos_compras_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  detalleconsultas:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sanmarcos_detalle_servicios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

  servicios:
    depends_on: *mysql-ready
    environment:
      <<: *mysql-client
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/sanmarcos_servicios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

volumes:
  mysql-data:
