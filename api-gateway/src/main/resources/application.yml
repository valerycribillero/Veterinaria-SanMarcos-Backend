server:
  port: 8080
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

spring:
  application:
    name: api-gateway
  cloud:
    loadbalancer:
      cache:
        enabled: false
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowed-methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: "*"
          default-filters:
            - StripPrefix=1
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
          routes:
            - id: usuarios
              uri: lb://usuarios
              predicates:
                - Path=/usuarios/**
            - id: mensajeria-service
              uri: lb://mensajeria-service
              predicates:
                - Path=/mensajeria/**
            - id: mascota
              uri: lb://mascota
              predicates:
                - Path=/mascotas/**
            - id: catalogo
              uri: lb://catalogo
              predicates:
                - Path=/catalogo/**
            - id: ficha-service
              uri: lb://ficha-service
              predicates:
                - Path=/ficha/**
            - id: productos-service
              uri: lb://productos-service
              predicates:
                - Path=/productos/**
            - id: pedidos-service
              uri: lb://pedidos-service
              predicates:
                - Path=/pedidos/**
            - id: agenda-service
              uri: lb://agenda-service
              predicates:
                - Path=/agenda/**
            - id: compras
              uri: lb://compras
              predicates:
                - Path=/compras/**
            - id: detalleconsultas
              uri: lb://detalleconsultas
              predicates:
                - Path=/detalle-consultas/**
            - id: servicios
              uri: lb://servicios
              predicates:
                - Path=/servicios/**
