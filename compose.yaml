name: veterinaria-sanmarcos-backend

services:
  usuarios:
    build: ./usuarios
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  mensajeria-service:
    build: ./mensajeria-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/mensajeria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  mascota:
    build: ./mascota
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/mascota?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  catalogo:
    build: ./catalogo
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/producto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  ficha:
    build: ./ficha
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8085"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/sanmarcos_ficha_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  productos-service:
    build: ./productos-service
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8086"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/productos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  pedidos-service:
    build: ./pedidos-service
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8087"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/pedidos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"
      PRODUCTOS_URL: "http://productos-service:8086"
    depends_on:
      - productos-service

  agenda-service:
    build: ./agenda-service
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/agenda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  compras:
    build: ./compras
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8089"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/sanmarcos_compras_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"
