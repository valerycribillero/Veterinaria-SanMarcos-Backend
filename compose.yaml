name: veterinaria-sanmarcos-backend

x-eureka-client: &eureka-client
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

services:
  eureka-server:
    build: ./eureka-server
    ports:
      - "127.0.0.1:8761:8761"

  api-gateway:
    build: ./api-gateway
    depends_on: [eureka-server]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      <<: *eureka-client
      GATEWAY_BIND_ADDRESS: "0.0.0.0"

  usuarios:
    build: ./usuarios
    depends_on: [eureka-server]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *eureka-client
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/usuarios?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  mensajeria-service:
    build: ./mensajeria-service
    depends_on: [eureka-server]
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *eureka-client
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/mensajeria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  mascota:
    build: ./mascota
    depends_on: [eureka-server]
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *eureka-client
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8083"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/mascota?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  catalogo:
    build: ./catalogo
    depends_on: [eureka-server]
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      <<: *eureka-client
      SERVER_ADDRESS: "0.0.0.0"
      SERVER_PORT: "8084"
      SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/producto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:-root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD:-}"

  ficha:
